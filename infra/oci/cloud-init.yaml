#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - g++
  - make
  - nginx
  - certbot
  - ufw
users:
  - default
  - name: signalbound
    system: true
    shell: /usr/sbin/nologin
    home: /srv/signalbound
    create_home: true
runcmd:
  - [mkdir, -p, /var/www/letsencrypt, /srv/signalbound/releases]
